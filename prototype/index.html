<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#dfe0c6" />
  <title>风的试验田 · 概念原型</title>
  <meta name="description" content="一朵由代码生成的蒲公英。滑动鼠标或手指制造风，看种子飘散，再等它慢慢长回来。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23e9e1c6'/%3E%3Ccircle cx='16' cy='14' r='8' fill='%23fffaf0'/%3E%3Cpath d='M16 22v7' stroke='%237b934f' stroke-width='2'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./css/style.css?v=30" />
  <script>
    // Show a readable message if the scene fails to start.
    (function () {
      function report(msg, stack) {
        var el = document.createElement('pre');
        el.className = 'js-errors';
        el.textContent = String(msg) + '\n' + (stack || '');
        (document.body || document.documentElement).appendChild(el);
      }
      window.addEventListener('error', function (e) {
        report(e.message, e.error && e.error.stack);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason || {};
        report('Promise: ' + (reason.message || reason), reason.stack);
      });
    })();
  </script>
  <script type="importmap">
    { "imports": { "three": "../vendor/three.module.js" } }
  </script>
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="sky-glow"></div>
  </div>

  <canvas id="stage" aria-label="草地上的蒲公英，滑动可制造风"></canvas>
  <canvas id="fireflies" aria-hidden="true"></canvas>

  <div class="night-veil" id="nightVeil" aria-hidden="true"></div>
  <div class="golden-veil" id="goldenVeil" aria-hidden="true"></div>
  <div class="stars" id="stars" aria-hidden="true"></div>
  <div class="sun-rays" id="sunRays" aria-hidden="true"></div>

  <div class="celestial celestial--sun" id="sunBody" role="slider" tabindex="0"
       aria-label="太阳轨道：长按并沿天空弧线拖动，调整时间"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="40" aria-valuetext="时间 40%，午后">
    <div class="celestial__halo"></div>
    <div class="celestial__disc celestial__disc--sun"></div>
    <div class="celestial__hint">长按并沿弧线拖动 · 拨动时间</div>
  </div>

  <div class="celestial celestial--moon is-hidden" id="moonBody" role="slider" tabindex="0"
       aria-label="月亮轨道：长按并沿天空弧线拖动，调整时间"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="40" aria-valuetext="时间 40%，午后">
    <div class="celestial__halo"></div>
    <div class="celestial__disc celestial__disc--moon"></div>
    <div class="celestial__hint">长按并沿弧线拖动 · 拨动时间</div>
  </div>

  <svg class="celestial-arc" id="celestialArc" aria-hidden="true" focusable="false">
    <path id="celestialArcPath"></path>
    <path id="celestialArcBelow" class="celestial-arc__below"></path>
  </svg>

  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <div class="fore-sky" aria-hidden="true">
    <div class="fore-cloud fore-cloud--a"></div>
    <div class="fore-cloud fore-cloud--b"></div>
  </div>

  <header class="masthead">
    <p class="masthead__kicker"><a href="../index.html" style="pointer-events:auto;color:inherit">← Demo 目录</a></p>
    <h1 class="masthead__title">风的试验田</h1>
  </header>

  <div class="hint" id="hint" role="status">
    <span class="hint__rule" aria-hidden="true"></span>
    <span class="hint__text hint__text--mouse">点击草地种植 · 白绒成熟后滑过花头起风</span>
    <span class="hint__text hint__text--touch">轻点种植 · 滑过花头起风</span>
  </div>

  <div class="meter" aria-hidden="true">
    <span class="meter__label">WIND</span>
    <span class="meter__track"><i class="meter__fill"></i></span>
  </div>

  <div class="no-webgl">
    <p>这片草地需要 WebGL 才能生长。</p>
    <p class="no-webgl__sub">请换一个支持 WebGL 的浏览器，或开启硬件加速后再来。</p>
  </div>

  <pre class="debug" id="debug" hidden></pre>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
